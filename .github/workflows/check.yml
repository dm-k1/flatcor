# Checks flatcor on every push and pull request: four independent jobs that
# start at the same time, written from the quickest to the slowest.
#
#   lint               lintr, in the style of .lintr, and README.md up to date
#                      with README.Rmd and its example file (seconds)
#   check              R CMD check without Stan; the Stan tests skip
#                      themselves (a few minutes)
#   tests-cmdstanr     every test, the help pages' examples and the README's
#                      examples (inst/examples/quick_start.R), with cmdstanr
#                      and CmdStan (CmdStan is cached after the first run),
#                      and bridgestan for the Bayes factors (BridgeStan's
#                      sources are downloaded on its first build)
#   tests-rstan        the tests that use rstan (rstan from binary packages)
#
# rstan and cmdstanr get a job each, as they cannot share an R session for
# Bayes factors. On a public repository the runners are free.
name: Check

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::lintr, any::knitr, local::.
          needs: lint
      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}
      - name: README.md is made from README.Rmd and the current example file
        run: |
          Rscript -e 'knitr::knit("README.Rmd", "README.md", quiet = TRUE)'
          git diff --exit-code README.md || {
            echo "README.md is out of date: run knitr::knit(\"README.Rmd\") and commit it"
            exit 1
          }

  check:
    runs-on: ubuntu-latest
    env:
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::rcmdcheck, any::testthat, any::callr, any::pkgload
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  tests-cmdstanr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: >-
            any::testthat, any::callr, any::pkgload, any::devtools,
            stan-dev/cmdstanr, local::.
      - name: Cache CmdStan
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-2.40.0
      - name: Install CmdStan
        run: |
          if (is.null(tryCatch(cmdstanr::cmdstan_path(), error = function(e) NULL))) {
            cmdstanr::install_cmdstan(version = "2.40.0", cores = parallel::detectCores())
          }
          cmdstanr::cmdstan_version()
        shell: Rscript {0}
      - name: Install bridgestan
        run: |
          install.packages("bridgestan", repos = "https://r-multiverse.r-universe.dev")
          packageVersion("bridgestan")
        shell: Rscript {0}
      - name: Run every test
        env:
          NOT_CRAN: true
        run: testthat::test_local(reporter = c("summary", "fail"))
        shell: Rscript {0}
      - name: Run the help pages' examples
        run: devtools::run_examples(run_donttest = TRUE, document = FALSE)
        shell: Rscript {0}
      - name: Run the README's examples
        run: Rscript inst/examples/quick_start.R

  tests-rstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          # rstan compiles models with the headers of BH and RcppEigen, which a
          # binary install of rstan does not bring along
          extra-packages: >-
            any::testthat, any::callr, any::pkgload, any::rstan,
            any::BH, any::RcppEigen, local::.
      - name: Run the tests that use rstan
        env:
          NOT_CRAN: true
        run: testthat::test_local(filter = "rstan|fit", reporter = c("summary", "fail"))
        shell: Rscript {0}
